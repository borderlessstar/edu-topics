name: weekly-education-topics

on:
  schedule:
    - cron: "17 11 * * 0"   # 毎週日曜 20:17 JST（日曜 11:17 UTC）に自動実行
                            # ※GitHubの定期実行は数時間遅れることがある（2026-09-28は約3時間遅れ）。
                            #   月曜7:47のClaudeのまとめまで半日の余裕を取るため、前日の夜に実行する
  workflow_dispatch:        # 手動でも「Run workflow」ボタンで実行できる
  push:                     # スクリプトを書き換えたら、その場で1回試し実行する
    branches: [main]
    paths: ["collect_topics.py"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect topics
        run: python collect_topics.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ideas.csv weekly.md
          if git diff --staged --quiet; then
            echo "変更がないので、コミットもプッシュもしません"
            exit 0
          fi
          git commit -m "Add weekly education topics"
          git pull --rebase origin main
          git push origin HEAD:main
